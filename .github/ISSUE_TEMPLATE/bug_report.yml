name: Bug
description: Le CLI ne se comporte pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! **Ne collez jamais de clé API ni de jeton** (`yhk_client_v1_…`, `yhr_client_v1_…`).
        Pour un problème sur votre compte ou un service (pas sur le CLI), ouvrez plutôt un ticket : `yorkhost ticket create`.
  - type: input
    id: version
    attributes:
      label: Version
      description: Sortie de `yorkhost version`
      placeholder: yorkhost 1.0.0 (abc123, 2026-10-19) linux/amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Commande lancée
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Ce qui se passe
      description: Sortie complète, idéalement avec `--debug` (aucun secret n'y figure).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui était attendu
